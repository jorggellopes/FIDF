<script>
        const API_JAVA_URL = "https://fidf-api.onrender.com/api/tickets";

        let ticketsCache = [];
        let filtradosEspelho = [];
        let ticketAtual = null;

        let paginaAtual = 1;
        const itensPorPagina = 15;

        const TABELA_TOLERANCIAS = {
            "TOLERÂNCIA UTILITARIO": 1.5, "TOLERÂNCIA VAN": 3.0, "TOLERÂNCIA VUC": 5.0,
            "TOLERÂNCIA 34": 8.0, "TOLERÂNCIA TOCO": 12.0, "TOLERÂNCIA TRUCK": 24.0,
            "TOLERÂNCIA BITRUCK": 32.0, "TOLERÂNCIA CARRETA": 56.0
        };

        function extrairDataISO(strData) {
            if (!strData || strData === '---') return null;
            let limpo = strData.split(' ')[0].split('T')[0].trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(limpo)) return limpo;

            let partes = limpo.split(/[\/\.-]/);
            if (partes.length === 3) {
                if (partes[2].length === 4) {
                    let m = partes[0].padStart(2, '0');
                    let d = partes[1].padStart(2, '0');
                    let y = partes[2];
                    if (parseInt(m) > 12) { let temp = m; m = d; d = temp; }
                    return `${y}-${m}-${d}`;
                }
            }
            return null;
        }

        function formatarDataTela(strData) {
            if (!strData || strData === '---') return '---';
            const isoData = extrairDataISO(strData);
            if (!isoData) return strData;

            let partes = isoData.split('-');
            let hora = '';
            if (strData.includes(' ')) {
                hora = ' ' + strData.split(' ')[1].substring(0, 5);
            }
            return `${partes[2]}/${partes[1]}/${partes[0]}${hora}`;
        }

        function trocarAba(abaId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(abaId).classList.add('active');
            btnElement.classList.add('active');
            if (abaId === 'espelhoTab') filtrarEspelho();
            if (abaId === 'informativoTab') processarInformativo();
        }

        async function carregarDadosPlanilha() {
            try {
                const response = await fetch(API_JAVA_URL);
                if (!response.ok) throw new Error("Status HTTP " + response.status);

                const dados = await response.json();
                if (!Array.isArray(dados)) throw new Error("Resposta inválida do servidor Java");

                ticketsCache = dados.map(item => {
                    return {
                        id: item.id || '---',
                        placa: item.placa || '---',
                        veiculoModelo: item.veiculoModelo || '---',
                        motorista: item.motorista || '---',
                        movimento: item.movimento || '---',
                        tipoCarga: item.tipoCarga || '---',
                        numCarga: item.numCarga || '',
                        nf: item.nf || '',
                        dataEntradaRaw: item.dataEntradaTexto || '',
                        dataSaidaRaw: item.dataSaidaTexto || '',
                        dataEntradaTexto: formatarDataTela(item.dataEntradaTexto),
                        dataSaidaTexto: formatarDataTela(item.dataSaidaTexto),
                        lacres: item.lacres || '---',
                        quantPallets: item.quantPallets || 0,
                        pesoPallets: item.pesoPallets || 0,
                        pesoCheio: item.pesoCheio || 0,
                        pesoVazio: item.pesoVazio || 0,
                        pesoLiquido: item.pesoLiquido || 0,
                        pesoNf: item.pesoNf || 0,
                        divergencia: item.divergencia || 0,
                        conferente: item.conferente || '---',
                        statusCalculado: item.status || 'S/D'
                    };
                });

                atualizarFarol(true);

                const datalist = document.getElementById('idList');
                if (datalist) {
                    datalist.innerHTML = "";
                    ticketsCache.forEach(t => {
                        if (t.id && t.id !== '---') {
                            const opt = document.createElement('option');
                            opt.value = t.id;
                            opt.label = `${t.id} - ${t.placa}`;
                            datalist.appendChild(opt);
                        }
                    });
                }

                popularSelectConferentes();

                const filterInput = document.getElementById('filterDate');
                if (!filterInput.value && ticketsCache.length > 0) {
                    const ultimoValido = [...ticketsCache].reverse().find(t => t.dataEntradaRaw && t.dataEntradaRaw !== '---');
                    if (ultimoValido) {
                        const iso = extrairDataISO(ultimoValido.dataEntradaRaw);
                        if (iso) filterInput.value = iso;
                    }
                }

                atualizarDashboard();
                filtrarEspelho();

                if (document.getElementById('informativoTab').classList.contains('active')) {
                    processarInformativo();
                }

                if (ticketAtual) {
                    const recarregado = ticketsCache.find(x => x.id === ticketAtual.id);
                    if (recarregado) renderizarTicket(recarregado);
                } else if (ticketsCache.length > 0) {
                    const ultimoValido = [...ticketsCache].reverse().find(t => t.statusCalculado !== 'S/D');
                    if (ultimoValido) renderizarTicket(ultimoValido);
                }
            } catch (err) { 
                console.error("Erro ao carregar do servidor Java:", err); 
                atualizarFarol(false, "CONECTANDO VIA APPSHEET..."); 
            }
        }

        function popularSelectConferentes() {
            const select = document.getElementById('espFiltroConferente');
            if (!select) return;

            const valorSelecionado = select.value || 'TODOS';
            select.innerHTML = '<option value="TODOS">TODOS OS CONFERENTES</option>';

            const conjuntoConferentes = new Set();
            ticketsCache.forEach(t => {
                const conf = (t.conferente || '').trim();
                if (conf && conf !== '---' && conf !== 'null') {
                    conjuntoConferentes.add(conf);
                }
            });

            Array.from(conjuntoConferentes).sort().forEach(conf => {
                const opt = document.createElement('option');
                opt.value = conf;
                opt.textContent = conf;
                select.appendChild(opt);
            });

            if (conjuntoConferentes.has(valorSelecionado)) {
                select.value = valorSelecionado;
            } else {
                select.value = 'TODOS';
            }
        }

        function atualizarDashboard() {
            const filterInput = document.getElementById('filterDate');
            const dataFiltro = filterInput ? filterInput.value : '';

            const filtrados = ticketsCache.filter(t => {
                if (t.statusCalculado === 'S/D') return false;
                if (!dataFiltro) return true;
                const isoTicket = extrairDataISO(t.dataEntradaRaw);
                return isoTicket === dataFiltro;
            });

            document.getElementById('dashTotalVeiculos').innerText = filtrados.length;
            const totalVol = filtrados.reduce((sum, item) => sum + (item.pesoNf || 0), 0);
            document.getElementById('dashTotalVolumeNf').innerText = formatarNumero(totalVol) + " KG";

            const cargasM = {}; const movM = {}; const confM = {};

            filtrados.forEach(t => {
                const c = (t.tipoCarga || 'OUTROS').toUpperCase().trim();
                if (!cargasM[c]) cargasM[c] = { v: 0, p: 0 };
                cargasM[c].v++; cargasM[c].p += (t.pesoNf || 0);

                const m = (t.movimento || 'OUTROS').toUpperCase().trim();
                if (!movM[m]) movM[m] = { v: 0, p: 0 };
                movM[m].v++; movM[m].p += (t.pesoNf || 0);

                const conf = (t.conferente || '').trim();
                if (conf && conf !== '---') {
                    if (!confM[conf]) confM[conf] = { v: 0, p: 0 };
                    confM[conf].v++; confM[conf].p += (t.pesoNf || 0);
                }
            });

            const renderT = (id, map) => {
                const tbody = document.getElementById(id); 
                tbody.innerHTML = "";
                const keys = Object.keys(map);
                if (keys.length === 0) { 
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Sem dados para a data</td></tr>'; 
                    return; 
                }
                keys.sort().forEach(k => {
                    tbody.innerHTML += `<tr><td>${k}</td><td class="num-col">${map[k].v}</td><td class="num-col">${formatarNumero(map[k].p)}</td></tr>`;
                });
            };

            renderT('dashTableCarga', cargasM);
            renderT('dashTableMovimento', movM);

            const tbodyConf = document.getElementById('dashTableConferente');
            tbodyConf.innerHTML = "";
            const confKeys = Object.keys(confM);

            if (confKeys.length === 0) {
                tbodyConf.innerHTML = '<tr><td colspan="4" style="text-align:center;">Sem dados para a data</td></tr>';
            } else {
                confKeys.sort().forEach(k => {
                    const volConf = confM[k].p;
                    const pctVol = totalVol > 0 ? ((volConf / totalVol) * 100).toFixed(1) : "0.0";
                    tbodyConf.innerHTML += `
                        <tr>
                            <td>${k}</td>
                            <td class="num-col">${confM[k].v}</td>
                            <td class="num-col">${formatarNumero(volConf)}</td>
                            <td class="num-col" style="color:#511d9b;">${pctVol}%</td>
                        </tr>`;
                });
            }
        }

        function limparFiltrosEspelho() {
            document.getElementById('espFiltroBusca').value = '';
            document.getElementById('espFiltroConferente').value = 'TODOS';
            document.getElementById('espDataInicio').value = '';
            document.getElementById('espDataFim').value = '';
            document.getElementById('espFiltroStatus').value = 'TODOS';
            filtrarEspelho();
        }

        function filtrarEspelho() {
            const busca = (document.getElementById('espFiltroBusca').value || '').trim().toUpperCase();
            const confFiltro = document.getElementById('espFiltroConferente').value;
            const dtInicio = document.getElementById('espDataInicio').value;
            const dtFim = document.getElementById('espDataFim').value;
            const stFiltro = document.getElementById('espFiltroStatus').value;

            filtradosEspelho = ticketsCache.filter(t => {
                const matchTexto = !busca || 
                                   t.id.toUpperCase().includes(busca) || 
                                   t.placa.toUpperCase().includes(busca) || 
                                   t.motorista.toUpperCase().includes(busca) ||
                                   t.conferente.toUpperCase().includes(busca);

                const matchConferente = (confFiltro === 'TODOS') || (t.conferente === confFiltro);
                const matchStatus = (stFiltro === 'TODOS') || (t.statusCalculado === stFiltro);

                let matchData = true;
                const isoData = extrairDataISO(t.dataEntradaRaw);
                if (isoData) {
                    if (dtInicio && isoData < dtInicio) matchData = false;
                    if (dtFim && isoData > dtFim) matchData = false;
                }

                return matchTexto && matchConferente && matchStatus && matchData;
            });

            atualizarCardsResumoEspelho();
            paginaAtual = 1; 
            renderizarTabelaEspelho();
        }

        function atualizarCardsResumoEspelho() {
            let cntVazio = 0, cntOk = 0, cntFalta = 0, cntSobra = 0;
            let volVazio = 0, volOk = 0, volFalta = 0, volSobra = 0;

            const totalRegistros = filtradosEspelho.length;
            const totalVolGeral = filtradosEspelho.reduce((sum, item) => sum + (item.pesoNf || 0), 0);

            filtradosEspelho.forEach(t => {
                const st = t.statusCalculado;
                const pNf = t.pesoNf || 0;

                if (st === 'VAZIO') {
                    cntVazio++; volVazio += pNf;
                } else if (st === 'OK') {
                    cntOk++; volOk += pNf;
                } else if (st === 'FALTA') {
                    cntFalta++; volFalta += pNf;
                } else if (st === 'SOBRA') {
                    cntSobra++; volSobra += pNf;
                }
            });

            const calcPct = (parcial, total) => total > 0 ? ((parcial / total) * 100).toFixed(1) : "0.0";

            document.getElementById('stValVazio').innerText = `${cntVazio} veíc. (${calcPct(cntVazio, totalRegistros)}%)`;
            document.getElementById('stVolVazio').innerText = `${formatarNumero(volVazio)} KG (${calcPct(volVazio, totalVolGeral)}%)`;

            document.getElementById('stValOk').innerText = `${cntOk} veíc. (${calcPct(cntOk, totalRegistros)}%)`;
            document.getElementById('stVolOk').innerText = `${formatarNumero(volOk)} KG (${calcPct(volOk, totalVolGeral)}%)`;

            document.getElementById('stValFalta').innerText = `${cntFalta} veíc. (${calcPct(cntFalta, totalRegistros)}%)`;
            document.getElementById('stVolFalta').innerText = `${formatarNumero(volFalta)} KG (${calcPct(volFalta, totalVolGeral)}%)`;

            document.getElementById('stValSobra').innerText = `${cntSobra} veíc. (${calcPct(cntSobra, totalRegistros)}%)`;
            document.getElementById('stVolSobra').innerText = `${formatarNumero(volSobra)} KG (${calcPct(volSobra, totalVolGeral)}%)`;
        }

        function renderizarTabelaEspelho() {
            const tbody = document.getElementById('espelhoTableBody'); tbody.innerHTML = "";
            document.getElementById('espTotalRegistros').innerText = `Listando ${filtradosEspelho.length} registro(s)`;
            if (filtradosEspelho.length === 0) {
                tbody.innerHTML = `<tr><td colspan="12" style="text-align:center; padding:20px;">Nenhum registro encontrado.</td></tr>`;
                actualizarPaginacao(0, 0); return;
            }
            const totalPaginas = Math.ceil(filtradosEspelho.length / itensPorPagina);
            const inicio = (paginaAtual - 1) * itensPorPagina;
            const paginaItens = filtradosEspelho.slice(inicio, inicio + itensPorPagina);

            paginaItens.forEach(t => {
                let stClass = 'status-ok';
                if(t.statusCalculado === 'FALTA' || t.statusCalculado === 'SOBRA') stClass = 'status-falta';
                else if(t.statusCalculado === 'VAZIO') stClass = 'status-vazio';
                else if(t.statusCalculado === 'S/D') stClass = 'status-sd';

                tbody.innerHTML += `<tr>
                    <td style="text-align:center;"><button class="btn-view-ticket" onclick="abrirTicketPorId('${t.id}')">🎫 Ver</button></td>
                    <td style="font-weight:bold; background-color:#ffffcc;">${t.id}</td><td style="font-weight:bold;">${t.placa}</td>
                    <td>${t.veiculoModelo}</td><td>${t.motorista}</td><td>${t.dataEntradaTexto}</td><td>${t.dataSaidaTexto}</td>
                    <td>${formatarNumero(t.pesoNf)}</td><td style="font-weight:bold;">${formatarNumero(t.divergencia)}</td>
                    <td class="${stClass}" style="text-align:center;">${t.statusCalculado}</td><td>${t.conferente}</td><td>${t.tipoCarga}</td>
                </tr>`;
            });
            actualizarPaginacao(paginaAtual, totalPaginas);
        }

        function actualizarPaginacao(atual, total) {
            document.getElementById('currentPageNum').innerText = atual;
            document.getElementById('totalPagesNum').innerText = total;
            document.getElementById('btnPrevPage').disabled = (atual <= 1);
            document.getElementById('btnNextPage').disabled = (atual >= total || total === 0);
        }

        function mudarPagina(delta) { paginaAtual += delta; renderizarTabelaEspelho(); }
        function abrirTicketPorId(id) {
            const enc = ticketsCache.find(x => x.id === id);
            if (enc) { renderizarTicket(enc); trocarAba('ticketTab', document.querySelectorAll('.nav-btn')[0]); }
        }

        function exportarExcel() {
            if (filtradosEspelho.length === 0) { alert("Nenhum dado para exportar!"); return; }
            let csvStr = "ID;Placa;Veiculo;Motorista;Entrada;Saida;PesoNF;Divergencia;Status;Conferente;TipoCarga\n";
            filtradosEspelho.forEach(t => { csvStr += `"${t.id}";"${t.placa}";"${t.veiculoModelo}";"${t.motorista}";"${t.dataEntradaTexto}";"${t.dataSaidaTexto}";"${t.pesoNf}";"${t.divergencia}";"${t.statusCalculado}";"${t.conferente}";"${t.tipoCarga}"\n`; });
            const blob = new Blob(["\ufeff" + csvStr], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a"); link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", `Espelho_Balanca_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        function atualizarFarol(online, msg) {
            document.getElementById('statusDot').className = online ? 'status-dot online' : 'status-dot offline';
            document.getElementById('statusText').innerText = online ? `CONECTADO VIA APPSHEET API (${ticketsCache.length})` : (msg || 'FALHA');
            if (online) document.getElementById('lastSyncTime').innerText = new Date().toLocaleTimeString('pt-BR');
        }

        function tratarKeyPress(e) { if (e.key === 'Enter') executarBusca(); }
        function executarBusca() {
            const rawVal = document.getElementById('inputId').value; if (!rawVal) return;
            const tL = rawVal.trim().toUpperCase();
            const enc = ticketsCache.find(x => x.id.toUpperCase() === tL || x.placa.toUpperCase() === tL);
            if (enc) { document.getElementById('inputId').value = enc.id; renderizarTicket(enc); } else alert("Ticket não encontrado.");
        }
        function formatarNumero(num) { if (num === null || num === undefined) return "---"; return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
        
        function identificarToleranciaPorVeiculo(veiculo) {
            if (!veiculo) return 'TOLERÂNCIA TRUCK'; const v = veiculo.toUpperCase();
            if (v.includes('VAN')) return 'TOLERÂNCIA VAN'; if (v.includes('VUC')) return 'TOLERÂNCIA VUC';
            if (v.includes('3/4') || v.includes('34') || v.includes('3QT')) return 'TOLERÂNCIA 34'; if (v.includes('TOCO')) return 'TOLERÂNCIA TOCO';
            if (v.includes('BITRUCK')) return 'TOLERÂNCIA BITRUCK'; if (v.includes('TRUCK')) return 'TOLERÂNCIA TRUCK';
            if (v.includes('CARRETA') || v.includes('BITREM')) return 'TOLERÂNCIA CARRETA'; if (v.includes('UTILITARIO') || v.includes('PARTICULAR')) return 'TOLERÂNCIA UTILITARIO';
            return 'TOLERÂNCIA TRUCK';
        }

        function renderizarTicket(t) {
            ticketAtual = t; 
            document.getElementById('dataEmissao').innerText = new Date().toLocaleString('pt-BR');
            document.getElementById('id').innerText = t.id; 
            document.getElementById('placa').innerText = t.placa || '---';
            document.getElementById('veiculoModelo').innerText = t.veiculoModelo || '---'; 
            document.getElementById('motorista').innerText = t.motorista || '---';
            document.getElementById('dataEntrada').innerText = t.dataEntradaTexto || '---'; 
            document.getElementById('dataSaida').innerText = t.dataSaidaTexto || '---';
            document.getElementById('lacres').innerText = t.lacres || '---';

            document.getElementById('quantPallets').innerText = t.quantPallets > 0 ? t.quantPallets : '---';
            document.getElementById('pesoPallets').innerText = t.pesoPallets > 0 ? formatarNumero(t.pesoPallets) + ' KG' : '---';

            document.getElementById('pesoCheio').innerText = t.pesoCheio > 0 ? formatarNumero(t.pesoCheio) + ' KG' : '---';
            document.getElementById('pesoVazio').innerText = t.pesoVazio > 0 ? formatarNumero(t.pesoVazio) + ' KG' : '---';

            const pesoLiquido = (t.pesoCheio > 0 && t.pesoVazio > 0) ? (t.pesoCheio - t.pesoVazio) : null;
            document.getElementById('pesoLiquido').innerText = pesoLiquido !== null ? formatarNumero(pesoLiquido) + ' KG' : '---';

            document.getElementById('pesoNf').innerText = t.pesoNf > 0 ? formatarNumero(t.pesoNf) + ' KG' : '---';

            document.getElementById('divergencia').innerText = (pesoLiquido !== null && t.pesoNf >= 0) ? formatarNumero(t.divergencia) + ' KG' : '---';
            document.getElementById('conferente').innerText = t.conferente || '---';

            const tolNome = identificarToleranciaPorVeiculo(t.veiculoModelo);
            document.getElementById('toleranciaRotuloText').innerText = tolNome;

            recalcularToleranciaManual(); 
            gerarQRCodeNativo(t);
        }

        function recalcularToleranciaManual() {
            if (!ticketAtual) return; 
            const tolNome = identificarToleranciaPorVeiculo(ticketAtual.veiculoModelo);
            const limiteKg = TABELA_TOLERANCIAS[tolNome] || 24.0; 
            const divergencia = ticketAtual.divergencia || 0.0;

            document.getElementById('toleranciaValor').innerText = formatarNumero(limiteKg) + " KG";

            let status = calcularStatusInteligente(ticketAtual.placa, ticketAtual.dataEntradaRaw, ticketAtual.dataSaidaTexto, ticketAtual.tipoCarga, ticketAtual.pesoNf, divergencia, limiteKg);

            let resultado = "FORA DA TOLERÂNCIA";
            let stClass = 'value status-falta';

            if(status === 'VAZIO') { resultado = "VEÍCULO VAZIO / PÁTIO"; stClass = 'value status-vazio'; }
            else if(status === 'OK') { resultado = "DENTRO DA TOLERÂNCIA"; stClass = 'value status-ok'; }
            else if(status === 'S/D') { resultado = "SEM DADOS REGISTRADOS"; stClass = 'value status-sd'; }

            document.getElementById('resultado').innerText = resultado;
            const statusEl = document.getElementById('status');
            statusEl.innerText = status; 
            statusEl.className = stClass;
        }

        function calcularStatusInteligente(placa, dataEntradaRaw, dataSaidaTexto, tipoCarga, pesoNf, divergencia, limiteKg) {
            if (!placa || placa === '---' || !dataEntradaRaw || dataEntradaRaw === '---') return 'S/D';
            const cargaUpper = (tipoCarga || '').toUpperCase();
            if (cargaUpper.includes('VAZIO') || cargaUpper.includes('PATIO')) return 'VAZIO';
            if (pesoNf === 0) return 'OK';
            return Math.abs(divergencia) <= limiteKg ? "OK" : (divergencia < 0 ? "FALTA" : "SOBRA");
        }

        function gerarQRCodeNativo(t) {
            const hash = `FRM-${t.id}-${t.placa}-${Math.abs(t.divergencia || 0).toFixed(0)}`;
            document.getElementById('authHash').innerText = hash;
            const payload = encodeURIComponent(`FRIMESA FIDF|TICKET:${t.id}|PLACA:${t.placa}|AUTH:${hash}`);
            document.getElementById('qrCodeImg').src = `https://quickchart.io/qr?text=${payload}&size=120&margin=1`;
        }

        function baixarPDF() {
            if (!ticketAtual) return alert("Selecione um Ticket.");
            html2pdf().set({
                margin: [0.15, 0.15, 0.15, 0.15],
                filename: `Ticket_Balanca_${ticketAtual.id}_${ticketAtual.placa}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            }).from(document.getElementById('ticket')).save();
        }

        function enviarEmail() {
            if (!ticketAtual) return alert("Selecione um Ticket.");
            const assunto = encodeURIComponent(`Ticket Balança Frimesa FIDF - ID: ${ticketAtual.id} (${ticketAtual.placa})`);
            const corpo = encodeURIComponent(`FRIMESA TICKET BALANÇA\nID: ${ticketAtual.id}\nPLACA: ${ticketAtual.placa}\nMOTORISTA: ${ticketAtual.motorista}\nENTRADA: ${ticketAtual.dataEntradaTexto}\nSTATUS: ${ticketAtual.statusCalculado}`);
            window.location.href = `mailto:?subject=${assunto}&body=${corpo}`;
        }

        function imprimirTicket() { if (ticketAtual) window.print(); }

        carregarDadosPlanilha(); setInterval(carregarDadosPlanilha, 10000);

        /* =========================================================================
           SCRIPT EXCLUSIVO DO INFORMATIVO DIÁRIO DA OPERAÇÃO FIDF (CORRIGIDO)
           ========================================================================= */

        document.addEventListener("DOMContentLoaded", () => {
            const hojeIso = new Date().toISOString().split('T')[0];
            document.getElementById("dataInicio").value = hojeIso + "T00:00";
            document.getElementById("dataFim").value = hojeIso + "T23:59";
        });

        function lerDataHoraInformativo(str) {
            if (!str || str === '---') return null;
            let partes = str.trim().split(/[ T]/);
            let datePart = partes[0];
            let timePart = partes[1] || "00:00:00";

            let d, m, y;
            let dPartes = datePart.split(/[\/\.-]/);
            
            if (dPartes.length === 3) {
                if (dPartes[2].length === 4) { 
                    m = dPartes[0]; d = dPartes[1]; y = dPartes[2];
                    if (parseInt(m) > 12) { let temp = m; m = d; d = temp; }
                } else if (dPartes[0].length === 4) { 
                    y = dPartes[0]; m = dPartes[1]; d = dPartes[2];
                }
            } else {
                return null;
            }

            let t = timePart.split(':');
            return new Date(y, parseInt(m) - 1, d, parseInt(t[0]||0), parseInt(t[1]||0), parseInt(t[2]||0));
        }

        async function processarInformativo() {
            const dtInicioVal = document.getElementById("dataInicio").value;
            const dtFimVal = document.getElementById("dataFim").value;
            const tipoCargaFiltro = document.getElementById("tipoCarga").value;

            try {
                const dadosBalanca = ticketsCache; 
                
                let volRecebido = 0;
                let volDisponivel = 0;
                let volCross = 0;
                let conjuntoCarros = new Set();
                let ultimaDataHoraSaida = null;

                const dateStart = new Date(dtInicioVal);
                const dateEnd = new Date(dtFimVal);

                dadosBalanca.forEach(lancamento => {
                    // Data de entrada para validar a janela geral
                    const dataHoraEntrada = lerDataHoraInformativo(lancamento.dataEntradaRaw);
                    // Data/Hora de Saída específica para determinar a Hora da Largada
                    const dataHoraSaida = lerDataHoraInformativo(lancamento.dataSaidaRaw) || dataHoraEntrada;
                    
                    if (dataHoraEntrada && !isNaN(dataHoraEntrada.getTime())) {
                        if (dataHoraEntrada >= dateStart && dataHoraEntrada <= dateEnd) {
                            
                            const tipoCargaStr = (lancamento.tipoCarga || '').toUpperCase();
                            const passaFiltroTela = (tipoCargaFiltro === "TODOS" || tipoCargaStr.includes(tipoCargaFiltro));
                            
                            if (passaFiltroTela) {
                                const hora = dataHoraEntrada.getHours();
                                const peso = lancamento.pesoNf || 0; 

                                // Carros da operação
                                if (lancamento.placa && lancamento.placa !== '---') {
                                    conjuntoCarros.add(lancamento.placa);
                                }
                                
                                // Volume Recebido: Transferências (07:00 às 19:00)
                                if (tipoCargaStr.includes("TRANSFERÊNCIA") && hora >= 7 && hora < 19) {
                                    volRecebido += peso;
                                }

                                // Volume Disponível: Entregas (19:00 às 07:00)
                                if (tipoCargaStr.includes("ENTREGAS") && (hora >= 19 || hora < 7)) {
                                    volDisponivel += peso;
                                }

                                // Volume CROSS: CROSS (19:00 às 07:00)
                                if (tipoCargaStr.includes("CROSS") && (hora >= 19 || hora < 7)) {
                                    volCross += peso;
                                }

                                // Captura a Data/Hora DE SAÍDA do último carro para a Largada
                                if ((tipoCargaStr.includes("ENTREGAS") || tipoCargaStr.includes("CROSS")) && (hora >= 19 || hora < 7)) {
                                    if (dataHoraSaida && (!ultimaDataHoraSaida || dataHoraSaida > ultimaDataHoraSaida)) {
                                        ultimaDataHoraSaida = dataHoraSaida;
                                    }
                                }
                            }
                        }
                    }
                });

                const totalExpedido = volDisponivel + volCross;
                let statusLargada = "---";
                let strHoraLargada = "--:--";
                let classStatus = "";

                if (ultimaDataHoraSaida) {
                    const hh = ultimaDataHoraSaida.getHours();
                    const mm = ultimaDataHoraSaida.getMinutes().toString().padStart(2, '0');
                    strHoraLargada = `${hh.toString().padStart(2, '0')}:${mm}`;
                    
                    // Saídas até as 07:00:00 -> FINALIZADO
                    if (hh < 7 || (hh === 7 && mm === '00')) {
                        statusLargada = "FINALIZADO";
                        classStatus = "info-status-finalizado";
                    } else {
                        statusLargada = "ATRASADO";
                        classStatus = "info-status-atrasado";
                    }
                }

                // CÁLCULOS DOS NOVOS INDICADORES DE PERFORMANCE
                const capacidadeExpedicaoKg = 38000; // 38 Tons/dia
                const frotaTotalVeiculos = 12; // 12 Veículos
                
                const pctCapacidadeExp = capacidadeExpedicaoKg > 0 ? (totalExpedido / capacidadeExpedicaoKg) * 100 : 0;
                const pctFrotaUtilizada = frotaTotalVeiculos > 0 ? (conjuntoCarros.size / frotaTotalVeiculos) * 100 : 0;

                // CÁLCULO DA OCUPAÇÃO INVERTIDA DO WMS
                const percCongeladoOcupado = 87.6;
                const percResfriadoOcupado = 82.3;
                const percCDOcupado = 84.2;

                document.getElementById("valVolRecebido").innerText = formatarNumero(volRecebido) + " KG";
                document.getElementById("valVolDisponivel").innerText = formatarNumero(volDisponivel) + " KG";
                document.getElementById("valVolCross").innerText = formatarNumero(volCross) + " KG";
                document.getElementById("valTotalExpedido").innerText = formatarNumero(totalExpedido) + " KG";
                
                document.getElementById("valPctCapacidadeExp").innerText = pctCapacidadeExp.toFixed(1) + "%";
                document.getElementById("valCarrosDisp").innerText = conjuntoCarros.size;
                document.getElementById("valPctFrota").innerText = pctFrotaUtilizada.toFixed(1) + "%";

                document.getElementById("valHoraLargada").innerText = strHoraLargada;
                
                const stLargadaEl = document.getElementById("valStatusLargada");
                stLargadaEl.innerText = statusLargada;
                stLargadaEl.className = "info-value " + classStatus;

                document.getElementById("valOcupCongelado").innerText = percCongeladoOcupado.toFixed(1) + "%";
                document.getElementById("valOcupResfriado").innerText = percResfriadoOcupado.toFixed(1) + "%";
                document.getElementById("valOcupCD").innerText = percCDOcupado.toFixed(1) + "%";

            } catch (error) {
                console.error("Erro ao processar informativo:", error);
            }
        }

    </script>
